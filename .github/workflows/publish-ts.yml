# Publishes ts/ to npmjs.com when a `ts/vX.Y.Z` tag is pushed. The tag's
# version must match ts/package.json's "version".
#
# Uses trusted publishing (OIDC) now that @iest-tecnologia/auth exists on
# npm and GitHub is registered as its trusted publisher. The trusted
# publisher is configured for "npm stage publish" only, so this workflow
# stages the release; a maintainer must then run
# `npm stage approve <stage-id>` with 2FA to make it public.
name: Publish auth-next

on:
  push:
    tags: ["ts/v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: test "ts/v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm stage publish
