# Publishes ts/ to npmjs.com when a `ts/vX.Y.Z` tag is pushed. The tag's
# version must match ts/package.json's "version".
#
# Uses a classic automation token (NPM_TOKEN secret) rather than trusted
# publishing (OIDC): trusted publishing can only be configured for a package
# that already exists on npm, and @iest-tecnologia/auth is new. Once it's
# been published once, this can switch back to OIDC (see the ts/v0.1.x
# history of this file) if desired.
name: Publish auth-next

on:
  push:
    tags: ["ts/v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: test "ts/v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
